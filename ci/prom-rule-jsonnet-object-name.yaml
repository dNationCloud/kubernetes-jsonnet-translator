# Puts these rules into the object prometheus-rules-proxmox-generated, apart from
# the default object, and labels that object prometheus_rule_pve=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jsonnet-rule-cm-proxmox
  namespace: default
  labels:
    prometheus_rule_jsonnet: "1"
  annotations:
    prometheus_label: "prometheus_rule_pve=1"
    prometheus_rules_object_name: "prometheus-rules-proxmox-generated"
data:
  proxmox-rule.jsonnet: |-
    {
      groups: [
        {
          name: 'proxmox',
          rules: [
            { alert: 'ProxmoxTestAlert', expr: 'vector(1) > 0', 'for': '1m', labels: { severity: 'warning' } },
          ],
        },
      ],
    }
