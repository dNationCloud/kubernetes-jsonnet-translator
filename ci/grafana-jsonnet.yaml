apiVersion: v1
kind: ConfigMap
metadata:
  namespace: default
  name: jsonnet-cm
  labels:
    grafana_dashboard_jsonnet: "1"
  annotations:
    grafana_label: "grafana_dashboard=1"
data:
  example-dashboard.jsonnet: |-
    local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
    local dashboard = g.dashboard;
    local datasource = g.dashboard.variable.datasource;
    local statPanel = g.panel.stat;
    local prometheus = g.query.prometheus;

    local upCount =
      statPanel.new('Up')
      + statPanel.queryOptions.withTargets([
        prometheus.new('$datasource', 'sum(up{job="apiserver"})'),
      ])
      + { gridPos: { x: 0, y: 0, w: 6, h: 6 } };

    local datasourceTemplate =
      datasource.new('datasource', 'prometheus')
      + datasource.generalOptions.withLabel('Datasource');

    dashboard.new('Example Dashboard')
    + dashboard.withUid('example-dashboard')
    + dashboard.withEditable(true)
    + dashboard.withRefresh('10s')
    + dashboard.time.withFrom('now-5m')
    + dashboard.withVariables([datasourceTemplate])
    + dashboard.withPanels([upCount])
