name: Publish and tag docker image to release

on:
  push:
    branches:
    - main
    # Only if there are changes to release.
    paths:
    - 'docker/Dockerfile'
    - 'translator/**'
    - 'setup.py'
    - 'default_config.yaml'

env:
  IMAGE: dnationcloud/kubernetes-jsonnet-translator

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch history
      run: git fetch --prune --unshallow

    - name: Get docker image code version
      id: version
      run: |
        version=$(grep 'LABEL Version=' docker/Dockerfile | sed 's/LABEL Version="\(.*\)".*/\1/')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Get helm chart application version
      id: helm-app-version
      run: |
        app=$(grep "appVersion" chart/Chart.yaml | head -1 | awk '{print $2}')
        echo "app-version=$app" >> "$GITHUB_OUTPUT"

    - name: Check if helm chart application version equals docker version
      uses: nick-invision/assert-action@v1
      with:
        expected: ${{ steps.version.outputs.version }}
        actual: ${{ steps.helm-app-version.outputs.app-version }}

    # This workflow also runs for pushes that touch the image sources without
    # bumping the version label, so never overwrite an already released tag.
    - name: Check if docker image version is already published
      id: published
      run: |
        http_code=$(curl -s -o /dev/null -w '%{http_code}' \
          "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${{ steps.version.outputs.version }}")
        if [ "$http_code" = "200" ]; then
          echo "${IMAGE}:${{ steps.version.outputs.version }} is already published, skipping build and push"
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    # The arm64 image is emulated here, the hosted runner is amd64 only.
    # QEMU has to be registered before buildx starts its builder.
    - name: Set up QEMU
      if: steps.published.outputs.publish == 'true'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      id: buildx
      if: steps.published.outputs.publish == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: steps.published.outputs.publish == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image (linux/amd64,linux/arm64)
      if: steps.published.outputs.publish == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ./
        file: ./docker/Dockerfile
        builder: ${{ steps.buildx.outputs.name }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.IMAGE }}:latest

    - name: Configure Git
      run: |
        git config --global user.name "$GITHUB_ACTOR"
        git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
    - name: Tag branch
      uses: anothrNick/github-tag-action@1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.CICD_TOKEN }}
        CUSTOM_TAG: 'image-v${{ steps.version.outputs.version }}'
        RELEASE_BRANCHES: main
